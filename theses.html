<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지도학생 논문 — Text Lab. 911</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
body{background:var(--bg)}
.th{max-width:860px;margin:0 auto;padding:110px var(--pad) 60px}
.th h1{font-size:clamp(34px,6vw,68px);font-weight:600;letter-spacing:-.03em}
.th .lead{color:var(--ink2);margin:14px 0 28px;max-width:680px;word-break:keep-all;line-height:1.7}
.fl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;padding:7px 14px;border:0;background:none;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.fl input{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line2);border-radius:20px;min-width:240px;flex:1;max-width:360px;background:var(--panel)}
.fl .cnt{font-family:var(--mono);font-size:12px;color:var(--mute)}
h2.g{font-size:20px;font-weight:600;margin:32px 0 14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;word-break:keep-all;scroll-margin-top:90px}
.row.hl{border-color:var(--acc);box-shadow:0 0 0 3px rgba(36,64,216,.15)}
.nm{font-weight:600;font-size:15px}.ko{color:var(--ink2);font-size:13px;margin-left:6px;font-weight:400}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line2);white-space:nowrap}
.tag.phd{border-color:var(--acc);color:var(--acc)}.tag.grd{background:var(--bg2)}
.ti{font-weight:600;line-height:1.55;font-size:18px;letter-spacing:-.01em;margin-top:4px}
.ti small{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--acc);font-weight:500;margin-bottom:4px;margin-right:0}
.ti-en{font-size:13.5px;line-height:1.55;color:var(--mute);font-style:italic;margin-top:-2px}
.ti-o{display:none;font-size:12px;color:var(--mute);line-height:1.5}
html.translated-ltr .ti-o,html.translated-rtl .ti-o{display:block}
.ab{font-size:14.5px;color:var(--ink);line-height:1.85;margin-top:6px;white-space:pre-wrap}
.pend{color:var(--mute);font-size:14px;padding:4px 0}
.empty{color:var(--mute);padding:20px 0}
@media(max-width:640px){.row{padding:18px 16px}.ti{font-size:16.5px}}
</style></head><body>
<nav class="nav" id="nav"><div class="wrap g12">
  <a href="https://textlab911.com/" class="logo notranslate" translate="no"><i></i>Text Lab. 911</a>
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">MENU</button>
  <ul>
    <li><a href="https://textlab911.com/#tools">개발도구</a></li><li><a href="https://textlab911.com/#about">소개</a></li>
    <li><a href="https://textlab911.com/#research">연구</a></li><li><a href="https://textlab911.com/#members">구성원</a></li>
    <li><a href="https://textlab911.com/">대학원</a></li><li><a href="./">대학원 지도</a></li><li><a href="theses.html" class="active">지도학생 논문</a></li>
    <li><a href="https://textlab911.com/#contact">연락</a></li>
  </ul></div></nav>
<main class="th">
  <h1>지도학생 논문</h1>
  <p class="lead">서정호 교수 지도학생(재학생·졸업생)의 논문 제목(한글·영문)과 연구 초록입니다. 제목이 확정된 연구만 초록을 수록하며, 그 외는 「논문 제목 준비 중」으로 표시합니다.</p>
  <div class="fl">
    <div class="seg" id="fG"><button data-v="" class="on">전체</button><button data-v="재학생">재학생</button><button data-v="졸업생">졸업생</button></div>
    <div class="seg" id="fC"><button data-v="" class="on">전체 과정</button><button data-v="석사">석사</button><button data-v="박사">박사</button></div>
    <input id="q" type="search" placeholder="이름·제목·키워드 검색" aria-label="검색">
    <span class="cnt notranslate" translate="no" id="cnt"></span>
  </div>
  <div id="out"></div>
  <p class="meta notranslate" translate="no" id="meta"></p>
</main>
<footer><div class="wrap g12"><span class="c1-3">© Text Lab. 911</span><span class="c4-12">출처: 지도 현황 시트(학생별 연구 주제)·연구모형 자료 · 개인정보 미포함 · 자동 번역은 부정확할 수 있습니다</span></div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sid=n=>'s-'+n.toLowerCase().replace(/[^a-z0-9가-힣]+/g,'-');
let D=[],G='',C='';
const nameH=s=>`<span class="nm notranslate" translate="no">${esc(s.name)}</span>${s.name_ko&&s.name_ko!==s.name?`<span class="ko notranslate" translate="no">${esc(s.name_ko)}</span>`:''}`;
const tagsH=s=>`<div class="tags"><span class="tag ${s.course==='박사'?'phd':''}">${esc(s.course)}</span><span class="tag ${s.group==='졸업생'?'grd':''}">${esc(s.group)}</span><span class="tag">${esc(s.method)}</span></div>`;
const titlesH=s=>s.titles.map(t=>{
  const note=t.note||t.kind||'';
  const en=t.text_en||'';
  return `<div class="ti">${note?`<small>${esc(note)}</small><br>`:''}<span class="notranslate" translate="no">${esc(t.text)}</span></div>`+
    (en?`<div class="ti-en notranslate" translate="no">${esc(en)}</div>`:'')+
    `<div class="ti-o notranslate" translate="no">원문: ${esc(t.text)}</div>`;
}).join('');
function row(s){return `<article class="row" id="${sid(s.name)}"><div>${nameH(s)}</div>${tagsH(s)}${s.titles.length?titlesH(s)+(s.summary?`<div class="ab">${esc(s.summary)}</div>`:''):'<div class="pend">논문 제목 준비 중</div>'}</article>`}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=D.filter(s=>(!G||s.group===G)&&(!C||s.course===C)&&(!q||[s.name,s.name_ko,s.summary,...s.titles.map(t=>[t.text,t.text_en||''].join(' '))].join(' ').toLowerCase().includes(q)));
  let h='';for(const g of ['재학생','졸업생']){const a=f.filter(s=>s.group===g);if(!a.length)continue;h+=`<h2 class="g">${g} <span class="small notranslate" translate="no">${a.length}</span></h2><div class="stack">${a.map(row).join('')}</div>`}
  document.getElementById('out').innerHTML=h||'<p class="empty">검색 결과가 없습니다.</p>';
  document.getElementById('cnt').textContent=f.length+' / '+D.length;
}
for(const [id,set] of [['fG',v=>G=v],['fC',v=>C=v]])document.getElementById(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));set(b.dataset.v);render()};
document.getElementById('q').oninput=render;
fetch('assets/theses.json').then(r=>r.json()).then(j=>{D=j.students;render();document.getElementById('meta').textContent='데이터 갱신: '+j.generated_at;
  if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el){el.scrollIntoView({block:'center'});el.classList.add('hl')}}});
const nav=document.getElementById('nav'),mb=document.getElementById('menuBtn');mb&&(mb.onclick=()=>nav.classList.toggle('open'));
</script>
<script src="assets/lang.js"></script>
</body></html>
