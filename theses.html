<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head><body class="grad">
<nav class="nav" id="nav"><div class="wrap g12">
  <a href="./" class="logo notranslate" translate="no"><i></i>Text Lab. 911</a>
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">MENU</button>
  <!-- 본 연구소 사이트(textlab911.com) 개편·공개 전까지 개발도구·소개·제작 Works·연구·저서·연구개발·연락 GNB는 연결하지 않음 -->

    <li><a href="about.html">소개</a></li>

  </ul></div></nav>
<main class="page">
  <header class="page-hero">
    <p class="page-kicker">Student theses</p>
    <h1>지도학생 논문</h1>
    <p class="lead">서정호 교수 지도학생(졸업생·재학생)의 논문 제목(한글·영문)과 연구 초록입니다. 제목이 확정된 연구만 초록을 수록하며, 그 외는 「논문 제목 준비 중」으로 표시합니다.</p>
  </header>
  <div class="fl">
    <div class="seg" id="fG"><button data-v="" class="on">전체</button><button data-v="졸업생">졸업생</button><button data-v="재학생">재학생</button></div>
    <div class="seg" id="fC"><button data-v="" class="on">전체 과정</button><button data-v="석사">석사</button><button data-v="박사">박사</button></div>
    <div class="seg" id="fS"><button data-v="" class="on">전체 상태</button><button data-v="inprog">연구 진행 중</button></div>
    <input id="q" type="search" placeholder="이름·제목·키워드 검색" aria-label="검색">
    <span class="cnt notranslate" translate="no" id="cnt"></span>
  </div>
  <div id="out"></div>
  <p class="meta notranslate" translate="no" id="meta"></p>
</main>
<footer class="site-foot"><div class="wrap foot-inner">
  <span class="foot-brand notranslate" translate="no">© Text Lab. 911</span>
  <span class="foot-note">출처: 지도 현황 시트(학생별 연구 주제)·연구모형 자료 · 개인정보 미포함 · 자동 번역은 부정확할 수 있습니다</span>
</div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sid=n=>'s-'+n.toLowerCase().replace(/[^a-z0-9가-힣]+/g,'-');
let D=[],G='',C='',S='';
const yyH=s=>s.entry_yy?`<span class="yy-badge notranslate" translate="no" title="${esc(s.entry_yy)}학번">${esc(s.entry_yy)}학번</span>`:'';
const flagH=s=>s.cc?`<img class="flag" src="assets/flags/${esc(s.cc)}.svg" width="18" height="18" alt="" title="${esc(s.nationality||'')}" aria-label="${esc(s.nationality||'')}" loading="lazy" decoding="async">`:'';
const nameH=s=>`<span class="name-line">${yyH(s)}${flagH(s)}<span class="nm notranslate" translate="no">${esc(s.name)}</span>${s.name_ko&&s.name_ko!==s.name?`<span class="ko notranslate" translate="no">${esc(s.name_ko)}</span>`:''}</span>`;
const tagsH=s=>`<div class="tags"><span class="tag ${s.course==='박사'?'phd':'msc'}">${esc(s.course)}</span><span class="tag ${s.group==='졸업생'?'grd':'cur'}">${esc(s.group)}</span>${s.group==='재학생'?`<span class="tag inprog" data-status="inprog">연구 진행 중</span>`:''}${s.graduation?`<span class="tag grad-when notranslate" translate="no">${esc(s.graduation)}</span>`:''}<span class="tag method">${esc(s.method)}</span></div>`;
const titlesH=s=>s.titles.map(t=>{
  const note=t.note||t.kind||'';
  const en=t.text_en||'';
  return `<div class="ti">${note?`<small>${esc(note)}</small><br>`:''}<span class="notranslate" translate="no">${esc(t.text)}</span></div>`+
    (en?`<div class="ti-en notranslate" translate="no">${esc(en)}</div>`:'')+
    `<div class="ti-o notranslate" translate="no">원문: ${esc(t.text)}</div>`;
}).join('');
function methodH(s){if(!s.methodology)return'';const body=esc(s.methodology).replace(/\n/g,'<br>');return `<div class="th-block"><h3>연구방법론</h3><div class="th-method">${body}</div></div>`}
function modelH(s){if(!s.model||!window.GradResearchModel)return'';const inner=GradResearchModel.render(s.model);if(!inner)return'';const prose=s.model_note?`<p class="th-model-note">${esc(s.model_note)}</p>`:'';return `<div class="th-block"><h3>${s.model.type==='flow'?'연구 절차':'연구 모형'}</h3>${inner}${prose}</div>`}
function row(s){const inprog=s.group==='재학생';const note=(inprog&&s.summary)?`<p class="ab-note">현재 진행 중인 연구로, 내용과 결과는 변경될 수 있다.</p>`:'';return `<article class="th-row ${s.group==='졸업생'?'alumni':''}" id="${sid(s.name)}" data-status="${inprog?'inprog':'done'}"><div>${nameH(s)}</div>${tagsH(s)}${s.titles.length?titlesH(s)+note+(s.summary?`<div class="ab">${esc(s.summary)}</div>`:'')+methodH(s)+modelH(s):'<div class="pend">논문 제목 준비 중</div>'}</article>`}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=D.filter(s=>{
    if(G&&s.group!==G)return false;
    if(C&&s.course!==C)return false;
    if(S==='inprog'&&s.group!=='재학생')return false;
    const hay=[s.name,s.name_ko,s.summary,s.methodology||'',s.model_note||'',s.group==='재학생'?'연구 진행 중':'',...s.titles.map(t=>[t.text,t.text_en||''].join(' '))].join(' ').toLowerCase();
    if(q&&!hay.includes(q))return false;
    return true;
  });
  let h='';for(const g of ['졸업생','재학생']){const a=f.filter(s=>s.group===g);if(!a.length)continue;const cls=g==='졸업생'?'g-grad':'g-cur';h+=`<h2 class="g ${cls}"><span class="bar" aria-hidden="true"></span>${g} <span class="badge notranslate" translate="no">${a.length}</span></h2><div class="stack">${a.map(row).join('')}</div>`}
  document.getElementById('out').innerHTML=h||'<p class="empty">검색 결과가 없습니다.</p>';
  document.getElementById('cnt').textContent=f.length+' / '+D.length;
}
for(const [id,set] of [['fG',v=>G=v],['fC',v=>C=v],['fS',v=>S=v]])document.getElementById(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));set(b.dataset.v);render()};
document.getElementById('q').oninput=render;
fetch('assets/theses.json').then(r=>r.json()).then(j=>{D=j.students;render();document.getElementById('meta').textContent='데이터 갱신: '+j.generated_at;
  if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el){el.scrollIntoView({block:'center'});el.classList.add('jump')}}});
(function(){
  var nav=document.getElementById('nav'), mb=document.getElementById('menuBtn');
  if(mb) mb.onclick=function(){nav.classList.toggle('open');};
  var onScroll=function(){if(!nav)return;nav.classList.toggle('scrolled', window.scrollY>8);};
  onScroll(); window.addEventListener('scroll', onScroll, {passive:true});
})();
</script>
<script src="assets/research-model.js"></script>
<script src="assets/lang.js"></script>
</body></html>
