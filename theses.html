<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지도학생 논문 — Text Lab. 911</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
body{background:var(--bg)}
.th{max-width:1200px;margin:0 auto;padding:110px var(--pad) 60px}
.th h1{font-size:clamp(34px,6vw,68px);font-weight:600;letter-spacing:-.03em}
.th .lead{color:var(--ink2);margin:14px 0 28px;max-width:680px;word-break:keep-all;line-height:1.7}
.fl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;padding:7px 14px;border:0;background:none;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.fl input{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line2);border-radius:20px;min-width:240px;flex:1;max-width:360px;background:var(--panel)}
.fl .cnt{font-family:var(--mono);font-size:12px;color:var(--mute)}
h2.g{font-size:20px;font-weight:600;margin:26px 0 12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.cards{grid-template-columns:1fr}}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;display:flex;flex-direction:column;gap:8px;word-break:keep-all;scroll-margin-top:90px}
.sc:hover,.sc:focus{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.07);border-color:var(--acc);outline:none}
.sc.hl{border-color:var(--acc);box-shadow:0 0 0 3px rgba(36,64,216,.15)}
.nm{font-weight:600;font-size:15px}.ko{color:var(--ink2);font-size:13px;margin-left:6px;font-weight:400}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line2);white-space:nowrap}
.tag.phd{border-color:var(--acc);color:var(--acc)}.tag.grd{background:var(--bg2)}
.ti{font-weight:600;line-height:1.5;font-size:14.5px}.ti small{font-family:var(--mono);font-size:10.5px;color:var(--acc);font-weight:500;margin-right:6px}
.ti-o{display:none;font-size:12px;color:var(--mute);line-height:1.5}
html.translated-ltr .ti-o,html.translated-rtl .ti-o{display:block}
.sm{font-size:13.5px;color:var(--ink2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pend{color:var(--mute);font-size:14px}
.more{font-size:12px;color:var(--acc);margin-top:auto}
.empty{color:var(--mute);padding:20px 0}
.md{position:fixed;inset:0;z-index:2147483000;background:rgba(12,13,15,.55);display:none;align-items:center;justify-content:center;padding:20px}
.md.on{display:flex}
.md .bx{background:var(--panel);max-width:640px;width:100%;max-height:86vh;overflow:auto;border-radius:10px;padding:28px 30px;position:relative;word-break:keep-all}
.md .x{position:absolute;right:14px;top:12px;font-size:22px;border:0;background:none;cursor:pointer;color:var(--ink2)}
.md .ti{font-size:17px;margin:12px 0 6px}.md p.full{line-height:1.8;color:var(--ink);margin-top:12px}
.md .src{font-size:11.5px;color:var(--mute);margin-top:16px}
</style></head><body>
<nav class="nav" id="nav"><div class="wrap g12">
  <a href="https://textlab911.com/" class="logo notranslate" translate="no"><i></i>Text Lab. 911</a>
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">MENU</button>
  <ul>
    <li><a href="https://textlab911.com/#tools">개발도구</a></li><li><a href="https://textlab911.com/#about">소개</a></li>
    <li><a href="https://textlab911.com/#research">연구</a></li><li><a href="https://textlab911.com/#members">구성원</a></li>
    <li><a href="https://textlab911.com/">대학원</a></li><li><a href="./">대학원 지도</a></li><li><a href="theses.html" class="active">지도학생 논문</a></li>
    <li><a href="https://textlab911.com/#contact">연락</a></li>
  </ul></div></nav>
<main class="th">
  <h1>지도학생 논문</h1>
  <p class="lead">서정호 교수 지도학생(재학생·졸업생)의 논문 제목과 연구 내용 요약입니다. 카드를 누르면 전체 요약을 볼 수 있습니다.</p>
  <div class="fl">
    <div class="seg" id="fG"><button data-v="" class="on">전체</button><button data-v="재학생">재학생</button><button data-v="졸업생">졸업생</button></div>
    <div class="seg" id="fC"><button data-v="" class="on">전체 과정</button><button data-v="석사">석사</button><button data-v="박사">박사</button></div>
    <input id="q" type="search" placeholder="이름·제목·키워드 검색" aria-label="검색">
    <span class="cnt notranslate" translate="no" id="cnt"></span>
  </div>
  <div id="out"></div>
  <p class="meta notranslate" translate="no" id="meta"></p>
</main>
<div class="md" id="md" role="dialog" aria-modal="true"><div class="bx"><button class="x" id="mdX" aria-label="닫기">×</button><div id="mdB"></div></div></div>
<footer><div class="wrap g12"><span class="c1-3">© Text Lab. 911</span><span class="c4-12">미리보기 (Preview) · 출처: 지도 현황 시트(학생별 연구 주제)·연구모형 자료 · 개인정보 미포함 · 자동 번역은 부정확할 수 있습니다</span></div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sid=n=>'s-'+n.toLowerCase().replace(/[^a-z0-9가-힣]+/g,'-');
let D=[],G='',C='';
const nameH=s=>`<span class="nm notranslate" translate="no">${esc(s.name)}</span>${s.name_ko&&s.name_ko!==s.name?`<span class="ko notranslate" translate="no">${esc(s.name_ko)}</span>`:''}`;
const tagsH=s=>`<div class="tags"><span class="tag ${s.course==='박사'?'phd':''}">${esc(s.course)}</span><span class="tag ${s.group==='졸업생'?'grd':''}">${esc(s.group)}</span><span class="tag">${esc(s.method)}</span></div>`;
const titlesH=s=>s.titles.map(t=>`<div class="ti">${t.kind?`<small>${esc(t.kind)}</small>`:''}${esc(t.text)}</div><div class="ti-o notranslate" translate="no">원문: ${esc(t.text)}</div>`).join('');
function card(s,i){return `<div class="sc" id="${sid(s.name)}" tabindex="0" data-i="${i}">${'<div>'+nameH(s)+'</div>'}${tagsH(s)}${s.titles.length?titlesH(s)+(s.summary?`<div class="sm">${esc(s.summary)}</div><span class="more">전체 요약 보기 →</span>`:''):'<div class="pend">논문 제목 준비 중</div>'}</div>`}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=D.map((s,i)=>[s,i]).filter(([s])=>(!G||s.group===G)&&(!C||s.course===C)&&(!q||[s.name,s.name_ko,s.summary,...s.titles.map(t=>t.text)].join(' ').toLowerCase().includes(q)));
  let h='';for(const g of ['재학생','졸업생']){const a=f.filter(([s])=>s.group===g);if(!a.length)continue;h+=`<h2 class="g">${g} <span class="small notranslate" translate="no">${a.length}</span></h2><div class="cards">${a.map(([s,i])=>card(s,i)).join('')}</div>`}
  document.getElementById('out').innerHTML=h||'<p class="empty">검색 결과가 없습니다.</p>';
  document.getElementById('cnt').textContent=f.length+' / '+D.length;
}
function openM(i){const s=D[i];document.getElementById('mdB').innerHTML=`<div>${nameH(s)}</div>${tagsH(s)}${s.titles.length?titlesH(s):'<div class="pend" style="margin-top:12px">논문 제목 준비 중</div>'}${s.summary?`<p class="full">${esc(s.summary)}</p>`:''}<p class="src">요약은 학생 연구 원고(졸업생)와 지도 현황·연구모형 자료(재학생)를 바탕으로 작성했습니다.</p>`;md.classList.add('on');document.getElementById('mdX').focus()}
const md=document.getElementById('md');
document.getElementById('mdX').onclick=()=>md.classList.remove('on');
md.onclick=e=>{if(e.target===md)md.classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='Escape')md.classList.remove('on');const c=e.target.closest&&e.target.closest('.sc');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openM(+c.dataset.i)}});
document.getElementById('out').onclick=e=>{const c=e.target.closest('.sc');if(c)openM(+c.dataset.i)};
for(const [id,set] of [['fG',v=>G=v],['fC',v=>C=v]])document.getElementById(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));set(b.dataset.v);render()};
document.getElementById('q').oninput=render;
fetch('assets/theses.json').then(r=>r.json()).then(j=>{D=j.students;render();document.getElementById('meta').textContent='데이터 갱신: '+j.generated_at;
  if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el){el.scrollIntoView({block:'center'});el.classList.add('hl')}}});
const nav=document.getElementById('nav'),mb=document.getElementById('menuBtn');mb&&(mb.onclick=()=>nav.classList.toggle('open'));
</script>
<script src="assets/lang.js"></script>
</body></html>
